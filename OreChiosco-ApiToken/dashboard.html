<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Chiosco</title>
    <link rel="stylesheet" href="style/02_components_1.css">
    <link rel="stylesheet" href="style/02_components_2.css">
    <link rel="stylesheet" href="style/03_layout_1.css">
    <link rel="stylesheet" href="style/03_layout_2.css">
    <link rel="stylesheet" href="style/05_mobile_optimization.css">
</head>
<body>
    <button class="mobile-menu-toggle" id="mobile-menu-toggle">☰</button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="app-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>🏖️ Chiosco</h2>
                <p id="user-info">Dipendente</p>
            </div>
            
            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="active">📊 Dashboard</a></li>
                <li><a href="calendar.html">📅 Calendario</a></li>
                <li><a href="libro-nero.html">📖 Libro Nero</a></li>
                <li><a href="admin.html" id="admin-link" style="display: none;">⚙️ Admin</a></li>
                <li><a href="#" id="logout-btn">🚪 Logout</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <header class="page-header">
                <h1>Dashboard Dipendente</h1>
                <div class="date-navigation">
                    <button id="prev-date" class="btn btn-secondary">◀</button>
                    <span id="current-date"></span>
                    <button id="next-date" class="btn btn-secondary">▶</button>
                </div>
            </header>
            
            <div class="dashboard-grid">
                <div class="card">
                    <div class="card-header">
                        <h3>Inserimento Ore</h3>
                        <button id="add-shift-btn" class="btn btn-primary">+ Aggiungi Turno</button>
                    </div>
                    
                    <div class="card-body">
                        <div class="checkbox-group">
                            <label>
                                <input type="checkbox" id="rest-day-checkbox">
                                <span>Giorno di riposo</span>
                            </label>
                            <label>
                                <input type="checkbox" id="festa-checkbox">
                                <span>Festa</span>
                            </label>
                        </div>
                        
                        <div id="shifts-container">
                            <!-- Shifts will be added here dynamically -->
                        </div>
                        
                        <div class="form-actions">
                            <button id="save-hours-btn" class="btn btn-success">Salva Ore</button>
                            <button id="current-time-btn" class="btn btn-secondary">Orario Corrente</button>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3>Storico Ore</h3>
                    </div>
                    <div class="card-body">
                        <div id="hours-history" class="hours-history">
                            <!-- History will be loaded here -->
                        </div>
                        <div class="total-hours">
                            <strong>Totale: <span id="total-hours">0h 0m</span></strong>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
