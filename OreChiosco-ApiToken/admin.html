<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Chiosco</title>
    <link rel="stylesheet" href="style/02_components_1.css">
    <link rel="stylesheet" href="style/02_components_2.css">
    <link rel="stylesheet" href="style/03_layout_1.css">
    <link rel="stylesheet" href="style/03_layout_2.css">
    <link rel="stylesheet" href="style/05_mobile_optimization.css">
</head>
<body>
    <button class="mobile-menu-toggle" id="mobile-menu-toggle">☰</button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="app-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>🏖️ Chiosco</h2>
                <p id="user-info">Admin</p>
            </div>
            
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="calendar.html">📅 Calendario</a></li>
                <li><a href="libro-nero.html">📖 Libro Nero</a></li>
                <li><a href="admin.html" class="active">⚙️ Admin</a></li>
                <li><a href="#" id="logout-btn">🚪 Logout</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <header class="page-header">
                <h1>Pannello Admin</h1>
            </header>
            
            <div class="admin-tabs">
                <button class="tab-button active" data-tab="employees">Gestione Dipendenti</button>
                <button class="tab-button" data-tab="shifts">Turni</button>
                <button class="tab-button" data-tab="hours-input">Modifica Ore</button>
                <button class="tab-button" data-tab="hours-view">Visualizza Ore</button>
                <button class="tab-button" data-tab="monthly-total">Totale Mensile</button>
            </div>
            
            <div class="tab-content">
                <div id="employees-tab" class="tab-pane active">
                    <!-- Employee management content will be loaded here -->
                </div>
                
                <div id="shifts-tab" class="tab-pane">
                    <!-- Shift management content will be loaded here -->
                </div>
                
                <div id="hours-input-tab" class="tab-pane">
                    <!-- Hours input content will be loaded here -->
                </div>
                
                <div id="hours-view-tab" class="tab-pane">
                    <!-- Hours view content will be loaded here -->
                </div>
                
                <div id="monthly-total-tab" class="tab-pane">
                    <!-- Monthly total content will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Employee Modal -->
    <div id="employee-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Aggiungi Dipendente</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="employee-form">
                    <div class="form-group">
                        <label for="employee-username">Username</label>
                        <input type="text" id="employee-username" required>
                    </div>
                    <div class="form-group">
                        <label for="employee-password">Password</label>
                        <input type="password" id="employee-password" required>
                    </div>
                    <div class="form-group">
                        <label for="employee-role">Ruolo</label>
                        <select id="employee-role" required>
                            <option value="employee">Dipendente</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="save-employee-btn" class="btn btn-primary">Salva</button>
                <button class="btn btn-secondary modal-close">Annulla</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
